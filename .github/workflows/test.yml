name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup asdf-vm
        uses: equisoft-actions/with-asdf-vm@v2
      - name: Install NPM dependencies
        uses: equisoft-actions/yarn-install@v1
      - name: Run tests
        run: yarn test:ci
